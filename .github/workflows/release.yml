name: Release

# kidager-bot creates the release PR and the releases, so release events start this workflow
on:
  release:
    types: [published]
  # Emergency path: publish an image from an existing tag
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, e.g. v3.35.0
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-26.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check the tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Not a release tag: $TAG"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          # Only the newest release moves latest, also when an older tag is published by hand
          newest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "latest=$([ "$newest" = "$TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The action pulls vX.Y (from its package.json version), see source/app/action/run.sh
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=${{ steps.tag.outputs.latest }}
          tags: |
            type=semver,pattern=v{{version}},value=${{ steps.tag.outputs.version }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ steps.tag.outputs.version }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # The image installs google-chrome-stable, which only exists for amd64
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
